server {
    listen 80;
    server_name gorifi-dev.skolar.sk dev.podpultovka.biz;

    # Frontend static files
    root /var/www/gorifi-staging/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # API proxy to Node.js backend (staging port)
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for longer requests (e.g., file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Request body cap — keep in lockstep with nginx-gorifi.conf, which
        # carries the full derivation.
        #
        # ⚠ Unset, nginx sits at its 1 MB DEFAULT and answers its own bare HTML
        # 413 before Express runs, so a product photo over ~750 KB of source
        # image fails (a `data:` URI is base64, ~4/3 of the file) with no Slovak
        # message. ⚠ COUPLED TO THE APP'S OWN CAPS — express.json's 10mb
        # (backend/src/index.js) and multer's 5 MB fileSize (routes/products.js,
        # routes/bakery-products.js). If either moves, this moves with it, and
        # vice versa. 11m sits strictly above both so THIS hop never shadows the
        # app's own 413 (10m would be byte-identical to express.json and would win
        # the race). ⚠ That is not yet an end-to-end guarantee: staging also sits
        # behind the same Nginx Proxy Manager edge (doc §5), documented at 10m and
        # UNVERIFIED (§2b suggests that block may never have been applied), so the
        # edge may still answer first — or may still be on the 1 MB default, in
        # which case this change alone does not fix the bug. Measure it; see the
        # prod conf and the FUP-T8 backlog row.
        # Scoped to /api — no other location takes a request body.
        client_max_body_size 11m;
    }

    # Static file caching for assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # No cache for index.html (so deploys take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
}

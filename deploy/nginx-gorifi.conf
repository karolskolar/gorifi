server {
    listen 80;
    server_name gorifi.skolar.sk podpultovka.biz www.podpultovka.biz;

    # Frontend static files
    root /var/www/gorifi/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # API proxy to Node.js backend
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for longer requests (e.g., file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Request body cap.
        #
        # ⚠ Unset, nginx sits at its 1 MB DEFAULT and answers its own bare HTML
        # 413 before Express ever runs. That was a LIVE PRODUCTION BUG: an
        # admin's product photo failed at roughly 750 KB of source image (a
        # `data:` URI is base64, so ~4/3 of the file), with no Slovak message
        # and nothing in the app log. FUP-T6's multer 413 and FUP-T3's
        # `entity.too.large` → 413 are both unreachable through the deployed
        # path while this is unset — the e2e suite cannot see it either, since
        # every spec hits Express directly and never traverses this hop.
        #
        # ⚠ COUPLED TO THE APP'S OWN CAPS. If either of these moves, this line
        # moves with it — and vice versa; do not change one alone:
        #   - express.json({ limit: '10mb' })   backend/src/index.js       (10485760 B)
        #   - multer fileSize 5 * 1024 * 1024   backend/src/routes/products.js,
        #                                       backend/src/routes/bakery-products.js
        # The JSON limit is the larger AND the one the shipped admin UI actually
        # hits: both image controls (`processImageFile` in CycleDetail.vue and
        # AdminBakeryProducts.vue, plus the drag-onto-a-row handler) send the
        # photo as a base64 `data:` URI inside a JSON body — the only multipart
        # request the frontend makes is the CSV import. So a 5m cap here would
        # NOT "match the app": it would refuse a ~4 MB photo Express accepts,
        # reintroducing this very bug one notch up.
        #
        # 11m rather than 10m, deliberately: this hop is a BACKSTOP, not a second
        # opinion on the app's limits. 10m here would be BYTE-IDENTICAL to
        # express.json's limit (both 10485760, both reject on exceed), so nginx
        # and Express would race on the same byte and nginx would win — the user
        # gets a bare HTML page where the app has a Slovak JSON one. Sitting
        # strictly above removes this hop from that race. Measured against the
        # backend directly: 10485760 B parses, 10485761 B returns
        # {"error":"Poziadavka je prilis velka"}.
        # (Note, NOT a justification for the extra MiB: multipart envelope
        # overhead puts a file at exactly the 5 MB multer cap at ~5.25 MB on the
        # wire — already ~5 MiB clear of even a 10m cap.)
        #
        # ⚠ THIS DOES NOT YET MAKE THE APP THE SOLE AUTHOR OF EVERY 413. A public
        # request crosses Nginx Proxy Manager FIRST, and NPM's cap is documented
        # at 10m (docs/deploy/nginx-proxy-manager.md, "Request size cap") — again
        # byte-identical to express.json, so express.json's own
        # `entity.too.large` 413 (FUP-T3) is UNREACHABLE from outside: anything
        # big enough to trigger it is refused at the edge first, as HTML. multer's
        # 413 (FUP-T6) IS publicly reachable (5 MiB + envelope is ~5 MiB clear of
        # the edge). To make the claim unconditional, raise the NPM edge above
        # this value too.
        # ⚠⚠ AND THAT 10m IS UNVERIFIED — §2b of that same doc concludes the NPM
        # Advanced block containing it "was never applied or never saved", which
        # is why the security headers moved into THIS file (see the note further
        # down). If NPM is in fact on nginx's 1 MB default, this change alone does
        # NOT fix the reported bug — the photo still dies one hop earlier. The
        # edge must be MEASURED, not read; the backlog row carries the procedure.
        #
        # Scoped to /api on purpose — no other location accepts a request body,
        # so they keep nginx's protective 1 MB default. This hop's value also
        # governs anything reaching the LXC directly on the LAN, independently of
        # the edge.
        client_max_body_size 11m;
    }

    # Static file caching for assets
    #
    # ⚠ nginx REPLACES inherited add_header directives as soon as a location sets
    # one of its own — so every location with an add_header must repeat the
    # security headers, or it silently serves none. Verified: before this,
    # /assets/* came back with no security headers at all.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # No cache for index.html (so deploys take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers.
    #
    # These live HERE and not in Nginx Proxy Manager: NPM's "Advanced → Custom
    # Nginx Configuration" box cannot set headers at all (it says so itself —
    # add_header there is not used by nginx). Headers set here DO reach the
    # browser: NPM passes every upstream header through, stripping only the
    # hop-by-hop `connection` and adding HSTS + X-Served-By of its own (verified
    # by diffing the public response against this server's direct response).
    #
    # CSP is ENFORCING as of 2026-08-06, after two live browser walkthroughs
    # produced zero app-generated violations. Every directive is evidence-backed —
    # see docs/deploy/nginx-proxy-manager.md §2b, which also records what was NOT
    # observed and how to roll back in one command. In particular: `unsafe-eval` is
    # deliberately absent (the charting library was proven not to need it), and
    # `img-src data:` + `style-src 'unsafe-inline'` are both load-bearing — the
    # first carries 41 product images, the second up to 138 style attributes on a
    # single page. Removing either breaks the app.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
}

server {
    listen 80;
    server_name gorifi.skolar.sk podpultovka.biz www.podpultovka.biz;

    # Frontend static files
    root /var/www/gorifi/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # API proxy to Node.js backend
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for longer requests (e.g., file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static file caching for assets
    #
    # ⚠ nginx REPLACES inherited add_header directives as soon as a location sets
    # one of its own — so every location with an add_header must repeat the
    # security headers, or it silently serves none. Verified: before this,
    # /assets/* came back with no security headers at all.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # No cache for index.html (so deploys take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers.
    #
    # These live HERE and not in Nginx Proxy Manager: NPM's "Advanced → Custom
    # Nginx Configuration" box cannot set headers at all (it says so itself —
    # add_header there is not used by nginx). Headers set here DO reach the
    # browser: NPM passes every upstream header through, stripping only the
    # hop-by-hop `connection` and adding HSTS + X-Served-By of its own (verified
    # by diffing the public response against this server's direct response).
    #
    # CSP is ENFORCING as of 2026-08-06, after two live browser walkthroughs
    # produced zero app-generated violations. Every directive is evidence-backed —
    # see docs/deploy/nginx-proxy-manager.md §2b, which also records what was NOT
    # observed and how to roll back in one command. In particular: `unsafe-eval` is
    # deliberately absent (the charting library was proven not to need it), and
    # `img-src data:` + `style-src 'unsafe-inline'` are both load-bearing — the
    # first carries 41 product images, the second up to 138 style attributes on a
    # single page. Removing either breaks the app.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
}
